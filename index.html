<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#143461" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1B33" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Apply the saved theme before first paint (no flash). Mirrors src/lib/theme.ts; key is THEME_KEY in src/config.ts. */
      (function () {
        var p = null;
        try { p = localStorage.getItem('kabtak.theme'); } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var t = dark ? 'dark' : 'light';
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.style.colorScheme = t;
        if (p === 'light' || p === 'dark') {
          var m = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < m.length; i++) m[i].setAttribute('content', dark ? '#0B1B33' : '#143461');
        }
      })();
    </script>
    <meta name="description" content="Kab Tak? is an independent concept that explains what is commonly reported at your week of a hair routine. Works offline, no login, nothing leaves your phone." />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kab Tak" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kab Tak? Independent concept" />
    <meta property="og:description" content="Honest hair-journey timelines, week by week. Not an official Man Matters product." />
    <meta property="og:image" content="icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <title>Kab Tak? Independent concept</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
